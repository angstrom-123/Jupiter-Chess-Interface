<!DOCTYPE html>
<html>
<head>
    <title>Jupiter Client</title>
    <link rel="stylesheet" href="assets/index.css">
</head>

<body>
    <div class="container">
        <div class="side-bar">
            <a href="/">Jupiter Client</a>
            <a href="/">Play</a>
            <a href="/replay">Load</a>
            <a href="https://github.com/angstrom-123/Jupiter-Chess-Interface">GitHub</a>
        </div>
        <div class="content">
            <div id="click-cover" class="click-cover"></div>
            <div class="cards-parent">
                <div class="cards-container">
                    <div id="opponent-card" class="card">
                        <div class="card-name">
                            <p id="opponent-label">Player 1</p>
                        </div>
                        <div class="card-timer">
                            <p><span id="opponent-timer">60:00</span></p>
                        </div>
                    </div>
                    <div class="middle-card">
                        <button title="Flip Board" id="flip-board"><img src="assets/icons/repeat.png" alt="Flip board" style="transform: rotate(90deg); width: 75%;"></button>
                        <button title="Resign" id="resign"><span id="confirm-resign"></span><img id="resign-icon" src="assets/icons/white-flag.png" alt="Resign" style="width: 80%;"></button>
                        <button title="Copy FEN" id="fen"><img src="assets/icons/copy.png" alt="Copy FEN" style="width: 75%;"></button>
                    </div>
                    <div id="friendly-card" class="card">
                        <div class="card-name">
                            <p id="friendly-label">Player 2</p>
                        </div>
                        <div class="card-timer">
                            <p><span id="friendly-timer">60:00</span></p>
                        </div>
                    </div>
                </div>
                <div id="setup-game-menu" class="popup-menu">
                    <div class="heading-container">
                        <p>Game Setup</p>
                    </div>
                    <form id="setup-game-form" onsubmit="return false;">
                        <div class="play-against-container">
                            <label>White Player</label>
                            <div class="play-against">
                                <select id="white-player" name="white-player" value="white-player">
                                    <option value="Local">Local</option>
                                </select>
                            </div>
                        </div>
                        <div class="play-against-container">
                            <label>Black Player</label>
                            <div class="play-against">
                                <select id="black-player" name="black-player" value="black-player">
                                    <option value="Local">Local</option>
                                </select>
                            </div>
                        </div>
                        <div class="time-control-container">
                            <label>Time Control</label>
                            <div class="time-controls">
                                <div>
                                    <input type="radio" value="0:30" id="30sec" name="time-control">
                                    <label for="30sec">30 sec</label>
                                </div>
                                <div>
                                    <input type="radio" value="1" id="1min" name="time-control">
                                    <label for="1min">1 min</label>
                                </div>
                                <div>
                                    <input type="radio" value="5" id="5min" name="time-control" checked="checked">
                                    <label for="5min">5 min</label>
                                </div>
                                <div>
                                    <input type="radio" value="10" id="10min" name="time-control">
                                    <label for="10min">10 min</label>
                                </div>
                                <div>
                                    <input type="radio" value="1+1" id="1min+1" name="time-control">
                                    <label for="1min+1">1 + 1</label>
                                </div>
                                <div>
                                    <input type="radio" value="5+5" id="5min+5" name="time-control">
                                    <label for="5min+5">5 + 5</label>
                                </div>
                                <div>
                                    <input type="radio" value="10+10" id="10min+10" name="time-control">
                                    <label for="10min+10">10 + 10</label>
                                </div>
                            </div>
                        </div>
                        <input type="submit" value="Start Game">
                    </form>
                </div>
                <div id="loading-menu" class="loading-menu">
                    <p>Loading...</p>
                </div>
            </div>
            <div class="board-container">
                <div id="promotion-menu" class="promotion-container">
                    <div class="promotion-menu">
                        <p>Promote</p>
                        <div class="promotion-buttons">
                            <button id="promote-knight">
                                <img src="assets/sprites/b_knight_svg_NoShadow.svg" class="promote-icon" draggable="false">
                            </button>
                            <button id="promote-bishop">
                                <img src="assets/sprites/b_bishop_svg_NoShadow.svg" class="promote-icon" draggable="false">
                            </button> 
                            <button id="promote-rook">
                                <img src="assets/sprites/b_rook_svg_NoShadow.svg" class="promote-icon" draggable="false">
                            </button>
                            <button id="promote-queen">
                                <img src="assets/sprites/b_queen_svg_NoShadow.svg" class="promote-icon" draggable="false">
                            </button>
                        </div>
                    </div>
                </div>
                <div id="fen-menu" class="promotion-container">
                    <div class="fen-menu">
                        <button class="close-button" id="close-fen"><img src="assets/icons/close.png" alt="Close" style="width: 100%;"></button>
                        <p>Current Position FEN</p>
                        <div>
                            <span id="fen-span"></span>
                            <button title="Copy to Clipboard" id="copy-fen"><img src="assets/icons/copy.png" alt="Copy" style="width: 80%;"></button>
                        </div>
                    </div>
                </div>
                <div id="game-over-menu" class="promotion-container">
                    <div class="game-over-menu">
                        <p>Game Over</p>
                        <span id="game-over-span">[Color] won by [Condition]</span>
                        <div class="canvas-container">
                            <canvas id="mini-board-canvas" class="mini-board-canvas"></canvas>
                            <canvas id="mini-sprite-canvas" class="mini-sprite-canvas"></canvas>
                        </div>
                        <div class="button-container">
                            <button title="Download Game" id="download-game"><img src="assets/icons/download.png" alt="Download" style="width: 80%;"></button>
                            <button title="Ok" id="game-over-ok"><img src="assets/icons/check.png" alt="Ok" style="width: 90%;"></button>
                        </div>
                    </div>
                </div>
                <canvas id="board-canvas" class="board-canvas"></canvas>
                <canvas id="sprite-canvas" class="sprite-canvas"></canvas>
            </div>
        </div>
    </div>

    </div>
</body>
<script type="module" src="assets/dist/index.mjs" defer></script>
</html>
