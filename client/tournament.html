<!DOCTYPE html>
<html>
<head>
    <title>Jupiter Client</title>
    <link rel="stylesheet" href="assets/tournament.css">
</head>

<body>
    <div class="container">
        <div class="side-bar">
            <a href="/">Jupiter Client</a>
            <a href="/">Play</a>
            <a href="/replay">Load</a>
            <a class="active" href="/tournament">Tournament</a>
            <a href="https://github.com/angstrom-123/Jupiter-Chess-Interface">Jupiter Client</a>
            <a href="https://github.com/angstrom-123/Jupiter-Chess-Engine">Jupiter Engine</a>
        </div>
        <div class="content">
            <div id="click-cover" class="click-cover"></div>
            <div class="cards-parent">
                <div class="cards-container">
                    <div id="opponent-card" class="card">
                        <div class="card-name">
                            <p id="opponent-label">Player 1</p>
                        </div>
                        <div class="card-timer">
                            <p><span id="opponent-timer">60:00</span></p>
                        </div>
                    </div>
                    <div class="middle-card">
                        <button title="Flip Board" id="flip-board"><img src="assets/icons/repeat.png" alt="Flip board" style="transform: rotate(90deg); width: 75%;"></button>
                        <button title="End Tournament" id="resign"><span id="confirm-resign"></span><img id="resign-icon" src="assets/icons/white-flag.png" alt="End Tournament" style="width: 80%;"></button>
                        <button title="Copy FEN" id="fen"><img src="assets/icons/copy.png" alt="Copy FEN" style="width: 75%;"></button>
                    </div>
                    <div id="friendly-card" class="card">
                        <div class="card-name">
                            <p id="friendly-label">Player 2</p>
                        </div>
                        <div class="card-timer">
                            <p><span id="friendly-timer">60:00</span></p>
                        </div>
                    </div>
                </div>
                <div id="setup-tournament-menu" class="popup-menu">
                    <div class="heading-container">
                        <p>Game Setup</p>
                    </div>
                    <form id="setup-tournament-form" onsubmit="return false;">
                        <div class="play-against-container">
                            <label>Player 1</label>
                            <div class="play-against">
                                <select id="white-player" name="white-player" value="white-player">
                                </select>
                            </div>
                        </div>
                        <div class="play-against-container">
                            <label>Player 2</label>
                            <div class="play-against">
                                <select id="black-player" name="black-player" value="black-player">
                                </select>
                            </div>
                        </div>
                        <div class="time-control-container">
                            <label>Time Control</label>
                            <div class="time-controls">
                                <div>
                                    <input type="radio" value="0:10" id="10sec" name="time-control">
                                    <label for="10sec">10s</label>
                                </div>
                                <div>
                                    <input type="radio" value="0:20" id="20sec" name="time-control">
                                    <label for="20sec">20s</label>
                                </div>
                                <div>
                                    <input type="radio" value="0:30" id="30sec" name="time-control">
                                    <label for="30sec">30s</label>
                                </div>
                                <div>
                                    <input type="radio" value="1" id="1min" name="time-control">
                                    <label for="1min">1 min</label>
                                </div>
                                <div>
                                    <input type="radio" value="0:10+1" id="10sec+1" name="time-control" checked="checked">
                                    <label for="10sec+1">10s + 1</label>
                                </div>
                                <div>
                                    <input type="radio" value="0:20+1" id="20sec+1" name="time-control">
                                    <label for="20sec+1">20s + 1</label>
                                </div>
                                <div>
                                    <input type="radio" value="0:30+1" id="30sec+1" name="time-control">
                                    <label for="30sec+1">30s + 1</label>
                                </div>
                                <div>
                                    <input type="radio" value="1+1" id="1min+1" name="time-control">
                                    <label for="1min+1">1 + 1</label>
                                </div>
                            </div>
                            <div class="custom-time-control">
                                <div>
                                    <input type="radio" value="custom" id="custom" name="time-control">
                                    <label for="custom">Custom</label>
                                </div>
                                <div>
                                    <input type="number" min="0" placeholder="min (0)" id="minutes" name="custom-minutes">
                                    <label for="minutes"></label>
                                </div>
                                <div>
                                    <input type="number" min="0" placeholder="sec (30)" id="seconds" name="custom-seconds">
                                    <label for="seconds"></label>
                                </div>
                                <div>
                                    <input type="number" min="0" placeholder="inc (0)" id="increment" name="custom-increment">
                                    <label for="increment"></label>
                                </div>
                            </div>
                        </div>
                        <div class="time-control-container">
                            <label>Game Count</label>
                            <div class="time-controls">
                                <div>
                                    <input type="radio" value="20" id="20" name="game-count">
                                    <label for="20">20</label>
                                </div>
                                <div>
                                    <input type="radio" value="50" id="50" name="game-count" checked="checked">
                                    <label for="50">50</label>
                                </div>
                                <div>
                                    <input type="radio" value="100" id="100" name="game-count">
                                    <label for="100">100</label>
                                </div>
                                <div>
                                    <input type="radio" value="200" id="200" name="game-count">
                                    <label for="200">200</label>
                                </div>
                            </div>
                        </div>
                        <input type="submit" value="Start Tournament">
                    </form>
                </div>
                <div id="loading-menu" class="loading-menu">
                    <p>Loading...</p>
                </div>
            </div>
            <div class="board-container">
                <div id="fen-menu" class="promotion-container">
                    <div class="fen-menu">
                        <button class="close-button" id="close-fen"><img src="assets/icons/close.png" alt="Close" style="width: 100%;"></button>
                        <p>Current Position FEN</p>
                        <div>
                            <span id="fen-span"></span>
                            <button title="Copy to Clipboard" id="copy-fen"><img src="assets/icons/copy.png" alt="Copy" style="width: 80%;"></button>
                        </div>
                    </div>
                </div>
                <div id="tournament-over-menu" class="promotion-container">
                    <div class="tournament-over-menu">
                        <p>Tournament Over</p>
                        <div class="canvas-container">
                            <div class="names-container">
                                <span id="engine-1-name">[engine 1]</span>
                                <span id="engine-2-name">[engine 2]</span>
                            </div>
                            <canvas id="score-canvas" class="score-canvas"></canvas>
                            <div class="breakdown-container">
                                <div class="breakdown-item">
                                    <div class="green-circle"></div>
                                    <p>Checkmate</p>
                                    <span id="checkmate-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="green-circle"></div>
                                    <p>Timeout</p>
                                    <span id="timeout-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="gray-circle"></div>
                                    <p>Stalemate</p>
                                    <span id="stalemate-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="gray-circle"></div>
                                    <p>Material</p>
                                    <span id="material-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="gray-circle"></div>
                                    <p>Repetition</p>
                                    <span id="repetition-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="gray-circle"></div>
                                    <p>50 Move Rule</p>
                                    <span id="fifty-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="gray-circle"></div>
                                    <p>Interrupt</p>
                                    <span id="interrupt-reason">0</span>
                                </div>
                                <div class="breakdown-item">
                                    <div class="red-circle"></div>
                                    <p>Error</p>
                                    <span id="error-reason">0</span>
                                </div>
                            </div>
                        </div>
                        <div class="button-container">
                            <button title="Download Results" id="download-results"><img src="assets/icons/download.png" alt="Download" style="width: 80%;"></button>
                            <button title="Ok" id="tournament-over-ok"><img src="assets/icons/check.png" alt="Ok" style="width: 90%;"></button>
                        </div>
                    </div>
                </div>
                <canvas id="board-canvas" class="board-canvas"></canvas>
                <canvas id="sprite-canvas" class="sprite-canvas"></canvas>
            </div>
        </div>
</body>
<script type="module" src="assets/dist/tournament.mjs" defer></script>
</html>
